name: release

on:
  push:
    # 推送 v* 标签时自动构建并发布 Release，例如 v1.0.0
    tags:
      - 'v*'
  # 也可在 Actions 页面手动触发，仅构建验证不发布
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build windows/linux amd64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Build frontend (Vue3 + Vite)
        working-directory: web/ui
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: Build binaries
        env:
          CGO_ENABLED: 0
        run: |
          VERSION=${GITHUB_REF_NAME:-dev}
          LDFLAGS="-s -w -X main.version=${VERSION}"
          mkdir -p dist
          GOOS=windows GOARCH=amd64 go build -ldflags "${LDFLAGS}" -trimpath -o dist/ddns-go-acme-windows-amd64.exe .
          GOOS=linux   GOARCH=amd64 go build -ldflags "${LDFLAGS}" -trimpath -o dist/ddns-go-acme-linux-amd64 .

      - name: Package
        run: |
          cd dist
          zip ddns-go-acme-windows-amd64.zip ddns-go-acme-windows-amd64.exe
          tar -czf ddns-go-acme-linux-amd64.tar.gz ddns-go-acme-linux-amd64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ddns-go-acme-binaries
          path: |
            dist/*.zip
            dist/*.tar.gz
          retention-days: 7

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ddns-go-acme-windows-amd64.zip
            dist/ddns-go-acme-linux-amd64.tar.gz
